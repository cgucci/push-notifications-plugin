# Matches Connor's existing /opt/minecraft/server/paper.jar service.
# User, Group, WorkingDirectory and Restart settings remain in the original unit.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/minecraft-runner.py -Xms4G -Xmx8G -jar paper.jar --nogui
KillMode=mixed
TimeoutStopSec=120
